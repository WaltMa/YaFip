[project]
name = "yafip"
version = "0.1.0"
description = "Yet Another Financial Independence Platform - 本地 A 股数据平台（数据抓取系统）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pandas>=2.2",
    "tushare>=1.4.6",
    "akshare>=1.16",
    "six>=1.16",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yafip"]

[tool.hatch.build.targets.sdist]
include = [
    "src/yafip",
    "web",
    "docs",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: 真实接口冒烟（需 token/网络）"]
